version: '3.8'
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: dps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dps
      POSTGRES_PASSWORD: dps_secret
      POSTGRES_DB: dps
    ports:
      - "5432:5432"
    volumes:
      - dps_data:/var/lib/postgresql/data

volumes:
  dps_data: